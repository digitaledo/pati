<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vigilàncies de Pati</title>
  <!-- Llibreria SheetJS per parsejar l'Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --groga-bg: #fef3c7;
      --groga-border: #f59e0b;
      --groga-tag: #92400e;
      --blava-bg: #dbeafe;
      --blava-border: #3b82f6;
      --blava-tag: #1e40af;
    }
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      margin: 0;
      padding: 12px;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 12px;
    }

    #loading-screen {
      text-align: center;
      padding: 24px;
      font-weight: 600;
      color: #64748b;
    }

    /* Navegació de setmanes */
    .week-nav-card {
      padding: 8px 12px;
      transition: background-color 0.3s ease;
      border-left: 6px solid transparent;
    }
    .week-nav-card.setmana-groga { 
      background: var(--groga-bg); 
      border-left-color: var(--groga-border); 
      color: var(--groga-tag); 
    }
    .week-nav-card.setmana-blava { 
      background: var(--blava-bg); 
      border-left-color: var(--blava-border); 
      color: var(--blava-tag); 
    }
    .nav-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .nav-arrow {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: inherit;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .nav-arrow:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      transform: none !important;
    }
    .nav-arrow:active:not(:disabled) {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 1);
    }
    .week-info {
      text-align: center;
      flex: 1;
    }
    .week-title {
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .week-dates {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 2px;
      opacity: 0.9;
    }
    .btn-today {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      background: white;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid currentColor;
      cursor: pointer;
    }

    /* Controls */
    label { 
      font-size: 0.75rem; 
      font-weight: 700; 
      color: #64748b; 
      letter-spacing: 0.5px; 
    }
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      font-size: 1rem;
      margin-top: 6px;
      background: #fff;
      color: #0f172a;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
    }
    select:focus {
      border-color: #3b82f6;
    }

    /* Botons Dies */
    .days-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 14px 0;
    }
    .day-btn {
      padding: 10px 0;
      border: none;
      background: #f1f5f9;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #64748b;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .day-btn .num-dia {
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.85;
    }
    .day-btn.active {
      background: #0f172a;
      color: white;
    }
    .day-btn:active {
      transform: scale(0.96);
    }

    /* Resultat */
    .result-box {
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 20px 14px;
      text-align: center;
      background: #fafafa;
    }
    .badge-lloc {
      display: inline-block;
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 6px;
      text-transform: capitalize;
    }

    .info-conflictes {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff7ed;
      border: 1px solid #fdba74;
      color: #c2410c;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }

    .info-footer {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.5;
    }
    .info-footer strong { color: #0f172a; }

    /* Gestió d'Excel */
    details {
      background: white;
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    summary {
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }
    .admin-content {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-file {
      display: inline-block;
      text-align: center;
      background: #0f172a;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-reset {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div id="loading-screen" class="card">
      🔄 Sincronitzant taula de vigilàncies...
    </div>

    <div id="main-content" style="display: none;">
      <!-- Capçalera interactiva de setmana -->
      <div id="card-setmana" class="card week-nav-card">
        <div class="nav-controls">
          <button class="nav-arrow" id="btn-prev-week" onclick="canviarOffsetSetmanes(-1)" aria-label="Setmana anterior">‹</button>
          
          <div class="week-info">
            <div class="week-title" id="txt-nom-setmana">Setmana...</div>
            <div class="week-dates" id="txt-rang-dates">...</div>
            <div id="btn-tornar-avui" class="btn-today" style="display: none;" onclick="tornarAvui()">Tornar a avui</div>
          </div>

          <button class="nav-arrow" id="btn-next-week" onclick="canviarOffsetSetmanes(1)" aria-label="Setmana següent">›</button>
        </div>
      </div>

      <!-- Filtre docent i dies -->
      <div class="card">
        <label for="select-mestre">DOCENT:</label>
        <select id="select-mestre" onchange="actualitzarVista()">
          <option value="">-- Tria el teu nom --</option>
        </select>

        <div class="days-nav">
          <button class="day-btn" onclick="canviarDia(1)">
            <span>Dl</span>
            <span class="num-dia" id="num-dia-1"></span>
          </button>
          <button class="day-btn" onclick="canviarDia(2)">
            <span>Dt</span>
            <span class="num-dia" id="num-dia-2"></span>
          </button>
          <button class="day-btn" onclick="canviarDia(3)">
            <span>Dc</span>
            <span class="num-dia" id="num-dia-3"></span>
          </button>
          <button class="day-btn" onclick="canviarDia(4)">
            <span>Dj</span>
            <span class="num-dia" id="num-dia-4"></span>
          </button>
          <button class="day-btn" onclick="canviarDia(5)">
            <span>Dv</span>
            <span class="num-dia" id="num-dia-5"></span>
          </button>
        </div>

        <div class="result-box">
          <p style="margin: 0; font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase;">Lloc de vigilància:</p>
          <div class="badge-lloc" id="txt-lloc">Tria el teu nom</div>
          
          <div id="avís-conflictes" class="info-conflictes">
            La resolució de conflictes és a les taules de pícnic
          </div>
        </div>
      </div>

      <!-- Peu futbol -->
      <div class="card info-footer">
        <div><strong>Pista de futbol avui:</strong> <span id="txt-futbol-curs">-</span></div>
      </div>

      <!-- Opcions d'Admin per carregar manualment si es desitja -->
      <details>
        <summary>⚙️ Opcions avançades (Pujar Excel manual)</summary>
        <div class="admin-content">
          <label class="btn-file">
            📂 Seleccionar arxiu Excel
            <input type="file" id="input-excel" accept=".xlsx, .xls" style="display: none;" onchange="processarExcel(event)">
          </label>
          <button class="btn-reset" onclick="restaurarPerDefecte()">Restaurar taula original</button>
        </div>
      </details>
    </div>

  </div>

  <script>
    const NOM_FITXER_EXCEL = "vigilancies.xlsx";
    const DATA_BASE_GROGA = new Date(2026, 8, 14);

    const MESOS = [
      "gener", "febrer", "març", "abril", "maig", "juny",
      "juliol", "agost", "setembre", "octubre", "novembre", "desembre"
    ];

    const FUTBOL_CURSOS = {
      1: "6è",
      2: "3r",
      3: "5è",
      4: "Cicle Inicial (CI)",
      5: "4t"
    };

    // Respatller en codi de la graella original
    const TORN_LAIA_JUDIT = {
      "GROGA": { 1: "Música", 2: "Pista", 3: "Música", 5: "Res. Conflictes" },
      "BLAVA": { 1: "Música", 2: "Porxos", 3: "Música", 4: "Futbol", 5: "Hort" }
    };
    const TORN_VICKI_LORENA_MARIAM = {
      "GROGA": { 1: "Hort", 2: "Futbol", 3: "Res. Conflictes", 4: "Futbol", 5: "Res. Conflictes" },
      "BLAVA": { 1: "Hort", 2: "Futbol", 3: "Hort", 4: "Música", 5: "Futbol" }
    };
    const TORN_VANESSA_LAURAB = {
      "GROGA": { 1: "Pista", 2: "Futbol", 3: "Hort", 4: "Porxos", 5: "Futbol" },
      "BLAVA": { 1: "Res. Conflictes", 2: "Futbol", 3: "Pista", 4: "Res. Conflictes", 5: "Futbol" }
    };
    const TORN_MARGARIDA_MARTAC = {
      "GROGA": { 1: "Porxos", 2: "Futbol", 3: "Futbol", 4: "Hort", 5: "Porxos" },
      "BLAVA": { 1: "Pista", 2: "Pista", 3: "Pista", 4: "Pista", 5: "Futbol" }
    };
    const TORN_MANEL_ORIOL_XAVIP = {
      "GROGA": { 1: "Pista", 2: "Pista", 3: "Futbol", 4: "Pista", 5: "Futbol" },
      "BLAVA": { 1: "Pista", 2: "Pista", 3: "Pista", 4: "Pista", 5: "Pista" }
    };
    const TORN_MARTAS_LAIAO = {
      "GROGA": { 1: "Bibliopati", 3: "Bibliopati", 4: "Bibliopati", 5: "Porxos" },
      "BLAVA": { 1: "Bibliopati", 2: "Porxos", 3: "Bibliopati" }
    };

    const QUADRANT_DEFAULT = {
      "Cristina B": {
        "GROGA": { 2: "Bibliopati", 4: "Bibliopati", 5: "Bibliopati" },
        "BLAVA": { 2: "Bibliopati", 4: "Bibliopati" }
      },
      "Cristina M": {
        "GROGA": { 1: "Futbol", 3: "Pista", 4: "Pista" },
        "BLAVA": { 2: "Pista", 4: "Pista" }
      },
      "Josep Mª": {
        "GROGA": { 2: "Pista", 4: "Pista", 5: "Pista" },
        "BLAVA": { 2: "Futbol", 4: "Pista" }
      },
      "Judit C": TORN_LAIA_JUDIT,
      "Laia M": TORN_LAIA_JUDIT,
      "Laia O": TORN_MARTAS_LAIAO,
      "Laura B": TORN_VANESSA_LAURAB,
      "Laura Ba": {
        "GROGA": { 2: "Porxos", 4: "Futbol", 5: "Res. Conflictes" },
        "BLAVA": { 2: "Res. Conflictes", 4: "Música" }
      },
      "Lorena": TORN_VICKI_LORENA_MARIAM,
      "Manel": TORN_MANEL_ORIOL_XAVIP,
      "Mar": {
        "GROGA": { 1: "Pista", 3: "Porxos", 4: "Res. Conflictes" },
        "BLAVA": { 2: "Hort", 4: "Futbol" }
      },
      "Marc": {
        "GROGA": { 1: "Futbol", 3: "Pista", 4: "Pista" },
        "BLAVA": { 2: "Pista", 4: "Pista" }
      },
      "Margarida A": TORN_MARGARIDA_MARTAC,
      "Maria M": TORN_VICKI_LORENA_MARIAM,
      "Marta C": TORN_MARGARIDA_MARTAC,
      "Marta S": TORN_MARTAS_LAIAO,
      "May": {
        "GROGA": { 2: "Res. Conflictes", 4: "Pista", 5: "Futbol" },
        "BLAVA": { 2: "Porxos", 4: "Res. Conflictes" }
      },
      "Mònica": {
        "GROGA": { 1: "Res. Conflictes", 3: "Pista", 4: "Hort" },
        "BLAVA": { 2: "Res. Conflictes", 4: "Hort" }
      },
      "Núria P": {
        "GROGA": { 1: "Pista", 3: "Pista", 4: "Música" },
        "BLAVA": { 2: "Res. Conflictes", 4: "Futbol" }
      },
      "Oriol": TORN_MANEL_ORIOL_XAVIP,
      "Susana": {
        "GROGA": { 2: "Hort", 4: "Futbol", 5: "Pista" },
        "BLAVA": { 2: "Res. Conflictes", 4: "Porxos" }
      },
      "Vanessa": TORN_VANESSA_LAURAB,
      "Vicki": TORN_VICKI_LORENA_MARIAM,
      "Xavi P": TORN_MANEL_ORIOL_XAVIP
    };

    let QUADRANT = {};
    let offsetSetmanes = 0;
    let diaSeleccionat = new Date().getDay();
    if (diaSeleccionat === 0 || diaSeleccionat === 6) diaSeleccionat = 1;
    let tipusSetmana = "GROGA";

    async function carregarExcelAutomatic() {
      try {
        const resposta = await fetch(`${NOM_FITXER_EXCEL}?t=${Date.now()}`);
        if (!resposta.ok) throw new Error("No s'ha trobat el fitxer al repositori.");

        const dadesBinaries = await resposta.arrayBuffer();
        const workbook = XLSX.read(new Uint8Array(dadesBinaries), { type: 'array' });
        const full = workbook.Sheets[workbook.SheetNames[0]];
        const dadesTaula = XLSX.utils.sheet_to_json(full, { header: 1 });

        const nouQuadrant = {};

        for (let r = 1; r < dadesTaula.length; r++) {
          const fila = dadesTaula[r];
          if (!fila || !fila[0]) continue;

          const nomBrut = String(fila[0]).trim();
          if (nomBrut.startsWith("ESPAI") || nomBrut.startsWith("PISTA") || nomBrut.startsWith("BIBLIO")) {
            break;
          }

          const docents = nomBrut.split(/[\/\n\r]+/).map(n => n.trim()).filter(n => n.length > 0);
          const horari = { "GROGA": {}, "BLAVA": {} };

          for (let d = 1; d <= 5; d++) {
            if (fila[d]) horari["GROGA"][d] = String(fila[d]).trim();
          }

          for (let d = 1; d <= 5; d++) {
            if (fila[d + 5]) horari["BLAVA"][d] = String(fila[d + 5]).trim();
          }

          docents.forEach(nom => {
            nouQuadrant[nom] = JSON.parse(JSON.stringify(horari));
          });
        }

        if (Object.keys(nouQuadrant).length > 0) {
          QUADRANT = nouQuadrant;
          localStorage.setItem("quadrant_cache", JSON.stringify(QUADRANT));
        } else {
          throw new Error("Dades buides.");
        }
      } catch (err) {
        console.warn("Fent servir còpia local / per defecte:", err.message);
        const cache = localStorage.getItem("quadrant_cache");
        if (cache) {
          QUADRANT = JSON.parse(cache);
        } else {
          QUADRANT = JSON.parse(JSON.stringify(QUADRANT_DEFAULT));
        }
      }

      document.getElementById("loading-screen").style.display = "none";
      document.getElementById("main-content").style.display = "block";

      carregarLlistaMestres();
      actualitzarSetmana();
    }

    function carregarLlistaMestres() {
      const select = document.getElementById("select-mestre");
      const guardat = select.value || localStorage.getItem("docent_preferit");
      select.innerHTML = '<option value="">-- Tria el teu nom --</option>';

      const mestres = Object.keys(QUADRANT).sort((a, b) => a.localeCompare(b, "ca"));
      mestres.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        select.appendChild(opt);
      });

      if (guardat && QUADRANT[guardat]) {
        select.value = guardat;
      }
    }

    function obtenirDillunsDeSetmana(d) {
      const date = new Date(d);
      const dia = date.getDay();
      const diff = (dia === 0 ? -6 : 1) - dia;
      date.setDate(date.getDate() + diff);
      date.setHours(0, 0, 0, 0);
      return date;
    }

    function actualitzarSetmana() {
      const avui = new Date();
      const dillunsActual = obtenirDillunsDeSetmana(avui);

      const dillunsVisualitzat = new Date(dillunsActual);
      dillunsVisualitzat.setDate(dillunsVisualitzat.getDate() + (offsetSetmanes * 7));

      const divendresVisualitzat = new Date(dillunsVisualitzat);
      divendresVisualitzat.setDate(divendresVisualitzat.getDate() + 4);

      const cursAny = (dillunsVisualitzat.getMonth() >= 8) ? dillunsVisualitzat.getFullYear() + 1 : dillunsVisualitzat.getFullYear();
      const dataLimitJuny = new Date(cursAny, 5, 30);

      const btnNext = document.getElementById("btn-next-week");
      btnNext.disabled = dillunsVisualitzat >= dataLimitJuny;

      const msPerSetmana = 1000 * 60 * 60 * 24 * 7;
      const diffS = Math.round((dillunsVisualitzat - DATA_BASE_GROGA) / msPerSetmana);
      tipusSetmana = (Math.abs(diffS) % 2 === 0) ? "GROGA" : "BLAVA";

      const dInici = dillunsVisualitzat.getDate();
      const mInici = MESOS[dillunsVisualitzat.getMonth()];
      const dFi = divendresVisualitzat.getDate();
      const mFi = MESOS[divendresVisualitzat.getMonth()];

      let textDates = "";
      if (mInici === mFi) {
        textDates = `${dInici} - ${dFi} de ${mInici}`;
      } else {
        const deOda = ["a", "e", "i", "o", "u"].includes(mFi[0]) ? "d'" : "de ";
        textDates = `${dInici} de ${mInici} - ${dFi} ${deOda}${mFi}`;
      }

      const card = document.getElementById("card-setmana");
      card.className = `card week-nav-card setmana-${tipusSetmana.toLowerCase()}`;
      document.getElementById("txt-nom-setmana").textContent = `Setmana ${tipusSetmana}`;
      document.getElementById("txt-rang-dates").textContent = textDates;

      document.getElementById("btn-tornar-avui").style.display = offsetSetmanes !== 0 ? "inline-block" : "none";

      for (let i = 1; i <= 5; i++) {
        const diaData = new Date(dillunsVisualitzat);
        diaData.setDate(diaData.getDate() + (i - 1));
        document.getElementById(`num-dia-${i}`).textContent = diaData.getDate();
      }

      document.querySelectorAll(".day-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === diaSeleccionat);
      });
      document.getElementById("txt-futbol-curs").textContent = FUTBOL_CURSOS[diaSeleccionat] || "-";

      actualitzarVista();
    }

    function canviarOffsetSetmanes(delta) {
      offsetSetmanes += delta;
      actualitzarSetmana();
    }

    function tornarAvui() {
      offsetSetmanes = 0;
      let d = new Date().getDay();
      if (d === 0 || d === 6) d = 1;
      diaSeleccionat = d;
      actualitzarSetmana();
    }

    function canviarDia(dia) {
      diaSeleccionat = dia;
      document.querySelectorAll(".day-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx + 1 === dia);
      });

      document.getElementById("txt-futbol-curs").textContent = FUTBOL_CURSOS[dia] || "-";
      actualitzarVista();
    }

    function actualitzarVista() {
      const mestre = document.getElementById("select-mestre").value;
      const txtLloc = document.getElementById("txt-lloc");
      const avisConflictes = document.getElementById("avís-conflictes");

      // Per defecte amagat
      avisConflictes.style.display = "none";

      if (!mestre) {
        txtLloc.textContent = "Tria el teu nom";
        txtLloc.style.color = "#64748b";
        return;
      }

      localStorage.setItem("docent_preferit", mestre);

      const tornMestre = QUADRANT[mestre]?.[tipusSetmana]?.[diaSeleccionat];
      if (tornMestre) {
        txtLloc.textContent = tornMestre;
        txtLloc.style.color = "#0f172a";

        // Comprovació estricta: ha de contenir "conflicte" o començar per "res. conf"
        const textNormalitzat = tornMestre.toLowerCase().trim();
        const esConflictes = textNormalitzat.includes("conflicte") || textNormalitzat.startsWith("res. conf");

        avisConflictes.style.display = esConflictes ? "block" : "none";
      } else {
        txtLloc.textContent = "Lliure / Sense vigilància";
        txtLloc.style.color = "#16a34a";
      }
    }

    function processarExcel(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evento) {
        try {
          const data = new Uint8Array(evento.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const json = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          const nouQuadrant = {};

          for (let r = 1; r < json.length; r++) {
            const fila = json[r];
            if (!fila || !fila[0]) continue;

            const nomDocentBrut = String(fila[0]).trim();
            if (nomDocentBrut.startsWith("ESPAI") || nomDocentBrut.startsWith("PISTA") || nomDocentBrut.startsWith("BIBLIO")) {
              break;
            }

            const nomsSeparats = nomDocentBrut.split(/[\/\n\r]+/).map(n => n.trim()).filter(n => n.length > 0);
            const tornDocent = { "GROGA": {}, "BLAVA": {} };

            for (let dia = 1; dia <= 5; dia++) {
              if (fila[dia]) tornDocent["GROGA"][dia] = String(fila[dia]).trim();
            }

            for (let dia = 1; dia <= 5; dia++) {
              if (fila[dia + 5]) tornDocent["BLAVA"][dia] = String(fila[dia + 5]).trim();
            }

            nomsSeparats.forEach(nom => {
              nouQuadrant[nom] = JSON.parse(JSON.stringify(tornDocent));
            });
          }

          if (Object.keys(nouQuadrant).length > 0) {
            QUADRANT = nouQuadrant;
            localStorage.setItem("quadrant_cache", JSON.stringify(QUADRANT));
            carregarLlistaMestres();
            actualitzarVista();
            alert("✅ Quadrant carregat amb èxit!");
          }
        } catch (err) {
          alert("❌ Error en llegir el fitxer: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function restaurarPerDefecte() {
      if (confirm("Vols restaurar el quadrant inicial?")) {
        localStorage.removeItem("quadrant_cache");
        QUADRANT = JSON.parse(JSON.stringify(QUADRANT_DEFAULT));
        carregarLlistaMestres();
        actualitzarVista();
        alert("Restaurat correctament!");
      }
    }

    carregarExcelAutomatic();
  </script>
